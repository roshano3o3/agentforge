services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    # Bound to localhost only -- there is no auth anywhere in AgentForge, so
    # nothing may be reachable from outside this machine.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agentforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Localhost only, same reason as Postgres. The run queue lives in DB 0;
    # the test suites use DBs 1 and 2 so they never share a queue with it.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      AGENTFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentforge}:${POSTGRES_PASSWORD:-agentforge}@postgres:5432/${POSTGRES_DB:-agentforge}
      AGENTFORGE_REDIS_URL: redis://redis:6379/0
      # Tracing: spans are stored in Postgres unless AGENTFORGE_TRACING=off.
      # OTLP export only when an endpoint is set, e.g. the jaeger profile below:
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile tracing up -d
      AGENTFORGE_TRACING: ${AGENTFORGE_TRACING:-on}
      # PII redaction of stored/exported spans; off only for local debugging.
      AGENTFORGE_TRACE_REDACTION: ${AGENTFORGE_TRACE_REDACTION:-on}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Executes evaluation runs. The only place adapters and evaluators run;
  # never started natively on Windows. No ports: it only talks to Redis and
  # Postgres inside the compose network (and to HTTP adapters it's pointed at).
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        # Set by scripts/docker-up.ps1, test.ps1 and test-ui.ps1 (scripts/git-sha.ps1).
        AGENTFORGE_GIT_SHA: ${AGENTFORGE_GIT_SHA:-}
    restart: unless-stopped
    environment:
      AGENTFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentforge}:${POSTGRES_PASSWORD:-agentforge}@postgres:5432/${POSTGRES_DB:-agentforge}
      AGENTFORGE_REDIS_URL: redis://redis:6379/0
      AGENTFORGE_TRACING: ${AGENTFORGE_TRACING:-on}
      # PII redaction of stored/exported spans; off only for local debugging.
      AGENTFORGE_TRACE_REDACTION: ${AGENTFORGE_TRACE_REDACTION:-on}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # The invoice agent's LLM planner (answer_llm, `agentforge compare --models`). Keys come only from
      # the git-ignored .env (see .env.example); empty means that provider isn't configured. Nothing in
      # the scripted examples, the tests or CI uses them.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    # Lets HTTP adapters reach a service on the host at host.docker.internal
    # (automatic on Docker Desktop; this line makes it work on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # Optional trace viewer, off by default: `docker compose --profile tracing up -d`
  # with OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 so the API and worker
  # export to it (the spans are stored in Postgres either way). UI on
  # http://127.0.0.1:16686. In-memory storage: traces vanish when it stops.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP/HTTP, for exporters on the host

volumes:
  agentforge_postgres_data:
