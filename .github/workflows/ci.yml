name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python suite (Postgres + Redis + worker container)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          # Test-only database; tests/conftest.py refuses any name not ending in _test.
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AGENTFORGE_TEST_DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@127.0.0.1:5432/agentforge_test
      AGENTFORGE_TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (editable, dependency order)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/evaluators -e packages/sdk \
            -e "apps/api[dev]" -e apps/worker -e cli -e examples/rag_app

      # The worker runs only in a Linux container, here as everywhere else.
      # Host networking lets it reach the service containers on 127.0.0.1.
      - name: Build and start the worker container
        run: |
          docker build -f apps/worker/Dockerfile -t agentforge-worker .
          docker run -d --name agentforge-test-worker --network host \
            -e AGENTFORGE_DATABASE_URL="$AGENTFORGE_TEST_DATABASE_URL" \
            -e AGENTFORGE_REDIS_URL="$AGENTFORGE_TEST_REDIS_URL" \
            agentforge-worker

      - name: pytest (Postgres; schema via Alembic, e2e through Redis + worker)
        run: python -m pytest tests -v

      - name: pytest (SQLite fallback)
        env:
          AGENTFORGE_TEST_DATABASE_URL: ""
          AGENTFORGE_TEST_REDIS_URL: ""
        run: python -m pytest tests -v

      - name: Worker logs
        if: always()
        run: docker logs agentforge-test-worker || true
