name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint + typecheck (ruff, mypy, eslint, tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages (editable, with dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/evaluators -e packages/sdk \
            -e "apps/api[dev]" -e apps/worker -e cli -e examples/rag_app

      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: eslint
        working-directory: apps/web
        run: npx eslint src e2e playwright.config.ts
      - name: tsc --noEmit
        working-directory: apps/web
        run: npx tsc --noEmit

  python:
    name: Python suite (Postgres + Redis + worker container)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          # Test-only database; tests/conftest.py refuses any name not ending in _test.
          POSTGRES_DB: agentforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AGENTFORGE_TEST_DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@127.0.0.1:5432/agentforge_test
      AGENTFORGE_TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (editable, dependency order)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/evaluators -e packages/sdk \
            -e "apps/api[dev]" -e apps/worker -e cli -e examples/rag_app

      # The worker runs only in a Linux container, here as everywhere else.
      # Host networking lets it reach the service containers on 127.0.0.1.
      - name: Build and start the worker container
        run: |
          docker build -f apps/worker/Dockerfile -t agentforge-worker .
          docker run -d --name agentforge-test-worker --network host \
            -e AGENTFORGE_DATABASE_URL="$AGENTFORGE_TEST_DATABASE_URL" \
            -e AGENTFORGE_REDIS_URL="$AGENTFORGE_TEST_REDIS_URL" \
            agentforge-worker

      - name: pytest (Postgres; schema via Alembic, e2e through Redis + worker)
        run: python -m pytest tests -v

      - name: pytest (SQLite fallback)
        env:
          AGENTFORGE_TEST_DATABASE_URL: ""
          AGENTFORGE_TEST_REDIS_URL: ""
        run: python -m pytest tests -v

      - name: Worker logs
        if: always()
        run: docker logs agentforge-test-worker || true

  browser:
    name: Browser tests (Playwright + Postgres + Redis + worker container)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AGENTFORGE_E2E_DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@127.0.0.1:5432/agentforge_e2e_test
      AGENTFORGE_E2E_REDIS_URL: redis://127.0.0.1:6379/2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The specs and playwright.config.ts use the repo's .venv (apps/web/e2e/env.ts).
      - name: Create .venv and install packages
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e packages/core -e packages/evaluators -e packages/sdk \
            -e apps/api -e apps/worker -e cli -e examples/rag_app

      - name: Build and start the worker container
        run: |
          docker build -f apps/worker/Dockerfile -t agentforge-worker .
          docker run -d --name agentforge-e2e-worker --network host \
            -e AGENTFORGE_DATABASE_URL="$AGENTFORGE_E2E_DATABASE_URL" \
            -e AGENTFORGE_REDIS_URL="$AGENTFORGE_E2E_REDIS_URL" \
            agentforge-worker

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm ci
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: apps/web
        run: npm run test:e2e

      - name: Worker logs
        if: always()
        run: docker logs agentforge-e2e-worker || true

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            apps/web/test-results
            docs/screenshots
          retention-days: 7
