name: AgentForge release gate

# On every pull request: evaluate the example invoice agent as the base branch
# has it (the production baseline) and as the PR has it (the candidate), then
# run `agentforge gate` with the base branch's release policy. The gate table
# is posted as one PR comment (updated on each push), and this check fails
# when the gate does. Logic: scripts/ci-gate.sh.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the gate comment

concurrency:
  group: agentforge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate (invoice agent, base vs PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentforge
          POSTGRES_PASSWORD: agentforge
          POSTGRES_DB: agentforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AGENTFORGE_DATABASE_URL: postgresql+asyncpg://agentforge:agentforge@127.0.0.1:5432/agentforge
      AGENTFORGE_REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - name: Check out the PR (candidate)
        uses: actions/checkout@v4

      - name: Check out the base branch (baseline + policy)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate/base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AgentForge (API + CLI) from the PR checkout
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/core -e packages/evaluators -e packages/sdk \
            -e apps/api -e apps/worker -e cli -e examples/rag_app \
            -e examples/invoice_agent

      - name: Evaluate base and PR, run the gate
        id: gate
        env:
          BASE_DIR: .gate/base
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/ci-gate.sh

      - name: Post or update the gate comment on the PR
        if: always() && steps.gate.outputs.exit_code != ''
        # A fork's PR gets a read-only token; the check result still stands.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- agentforge-release-gate -->";
            const report = fs.readFileSync(".gate/comment.md", "utf8");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              report.trim(),
              "",
              `<sub>Baseline: the invoice agent at the base branch (\`${process.env.BASE_SHA.slice(0, 7)}\`), ` +
                `set as \`production\`. Candidate: this PR (\`${process.env.HEAD_SHA.slice(0, 7)}\`). ` +
                `Policy and dataset from the base branch. Results are fixture-based (scripted planner). ` +
                `[Workflow run](${runUrl}) · updated on every push.</sub>`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail the check unless the gate passed
        if: always()
        run: |
          code="${{ steps.gate.outputs.exit_code }}"
          case "$code" in
            0) echo "RELEASE GATE: PASSED" ;;
            1) echo "::error::RELEASE GATE: FAILED"; exit 1 ;;
            *) echo "::error::The release gate could not be evaluated"; exit 1 ;;
          esac

      - name: API and worker logs
        if: failure()
        run: |
          cat .gate/api.log || true
          docker ps -a || true
