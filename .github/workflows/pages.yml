# Builds the landing page (site/build.sh: site/ + the demo and screenshots from docs/, the GIF converted to MP4)
# and deploys it to GitHub Pages: https://roshano3o3.github.io/agentforge/
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/demo.gif"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: bash site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
