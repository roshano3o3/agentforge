[project]
name = "agentforge-example-invoice-agent"
version = "0.1.0"
description = "Example 2: synthetic LangGraph invoice agent (v1 + a regressed v2, scripted or LLM planner) for AgentForge"
requires-python = ">=3.12"
# langgraph: the agent is a real LangGraph StateGraph with a ToolNode.
# openai / anthropic: the optional LLM planner (answer_llm). The scripted
# planner (every other adapter, and all of CI) never imports or calls them.
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "openai>=3.26,<4",
    "anthropic>=1.12,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_agent"]
