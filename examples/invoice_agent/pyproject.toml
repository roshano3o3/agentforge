[project]
name = "agentforge-example-invoice-agent"
version = "0.1.0"
description = "Example 2: synthetic LangGraph invoice agent (v1 + a regressed v2) for AgentForge trajectory evaluation"
requires-python = ">=3.12"
# langgraph: the agent is a real LangGraph StateGraph with a ToolNode.
# No model provider package: the planner is scripted, not an LLM.
dependencies = ["langgraph>=1.0,<2", "langchain-core>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_agent"]
