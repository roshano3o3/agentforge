# HELD-OUT calibration set for the answer checks (answer_contains, answer_regex) and graceful_tool_failure.
#
# 25 outputs from stored runs on the Docker dev stack that are NOT in answer_checks_v1.yaml (no item shares
# a (check, input, answer) with it): other repeats of the Benchmarks part B runs of Claude Sonnet 5.5 and
# Haiku 4.5, scripted v1 / v2 / v1-without-D2 runs, and the legacy scripted run, on invoice-agent v1/v3 and
# invoice-agent-safety v1. Llama 3.1 8B has no output left: all 10 of its stored answers are in the dev set.
#
# Drawn by a fixed rule, not by hand: distinct (model, check, case, answer) candidates, a per (model, check)
# quota, random.Random(7).sample over candidates sorted by result id. Stored verdicts and metric scores were
# never read. Labels were written on 2026-10-12 by reading each output, BEFORE any evaluator was run on
# these items, and are frozen (tests/unit/test_calibration.py pins their hash). Same rubric and scope as
# answer_checks_v1.yaml.
#
# Limits, stated up front:
#   * all 25 are labeled correct: the pool of unseen outputs holds no answer the rubric calls incorrect
#     (the incorrect ones -- scripted v2 regressions, Llama -- are already in the dev set; two unseen scripted v2
#     tool_failure outputs never call the failing tool, which the graceful_tool_failure rubric doesn't cover).
#     This set measures false positives (good answers failed) only; it cannot measure false negatives.
#   * 22 distinct outputs: hold-018 = hold-023, and hold-020 = hold-022 = hold-024 (same text from different
#     scripted planners; the steps differ for hold-020).
#   * the labeler is the same assistant that wrote the @1.1.0 evaluators; spot-check the labels.
name: answer-checks-calibration-holdout
version: 1
labeled_on: '2026-10-12'
