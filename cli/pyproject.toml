[project]
name = "agentforge-cli"
version = "0.1.0"
description = "AgentForge command-line interface"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
agentforge = "agentforge_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_cli"]
