[project]
name = "agentforge-worker"
version = "0.1.0"
description = "AgentForge arq worker: executes evaluation runs (Linux Docker container only)"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_worker"]
