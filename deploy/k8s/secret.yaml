# Credentials and model-provider keys. These are the LOCAL DEV defaults (the same as .env.example), so the stack
# comes up on a throwaway cluster with no extra step. For anything else, replace this Secret before applying it
# (`kubectl create secret generic agentforge-secrets --from-env-file=...`, or your secret manager) and never
# commit real values. Empty keys mean that LLM provider isn't configured; nothing in the demo uses them.
apiVersion: v1
kind: Secret
metadata:
  name: agentforge-secrets
type: Opaque
stringData:
  POSTGRES_USER: agentforge
  POSTGRES_PASSWORD: agentforge
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
