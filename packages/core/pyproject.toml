[project]
name = "agentforge-core"
version = "0.1.0"
description = "Shared Pydantic schemas for AgentForge (no ORM/DB dependency)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_core"]
