[project]
name = "agentforge-evaluators"
version = "0.1.0"
description = "Deterministic evaluators for AgentForge"
requires-python = ">=3.12"
# jsonschema: tool_args' JSON Schema matching. The only dependency; a partial
# hand-rolled schema check would not honestly be "JSON Schema".
dependencies = ["jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_evaluators"]
