[project]
name = "agentforge-sdk"
version = "0.1.0"
description = "Lightweight SDK for applications evaluated by AgentForge"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Spans from inside an agent (agentforge_sdk.tracing). Without it every helper is a no-op.
tracing = ["opentelemetry-api>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_sdk"]
